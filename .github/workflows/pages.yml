name: Build and publish the deck

# Publishes the built slides, handout and run sheet to GitHub Pages so the draft can be
# reviewed in a browser without cloning and building. build/ stays git-ignored: the
# artefacts are produced here, never committed.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: GitHub Actions. Until that is done the build succeeds and the deploy step
# fails with "HttpError: Not Found" — a 404 on creating the deployment, not on the
# artifact. Done for this repository on 24 August 2026.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 is deprecated on GitHub runners; 22 is the current LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Marp renders through a headless browser. The GitHub runner image ships Chrome;
      # point Marp at it explicitly rather than relying on auto-detection.
      - name: Locate Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser)" >> "$GITHUB_ENV"

      - name: Build everything, including what stays internal
        run: make all handout runsheet

      - name: Assemble the public site
        run: make site

      - name: Report the timing budget, and refuse notes in the site
        run: make check

      # build/site only. Publishing build/ wholesale is what put the assembled source,
      # the run sheet and the deck's speaker notes on a public URL: everything the deck
      # had ever built came along, because nobody listed what should not.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
